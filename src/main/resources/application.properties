spring.application.name=SophiaBackend
spring.datasource.url=jdbc:postgresql://localhost:5432/sophia_bdd
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=D@tabase#07
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.version=OPENAPI_3_0
logging.level.root=INFO
logging.level.com.sophia.backend=DEBUG
server.port=8080
spring.docker.compose.enabled=false

# JWT Configuration
jwt.secret=${JWT_SECRET:sophia-backend-secret-key-2026-very-secure-key-do-not-expose}
jwt.expiration=${JWT_EXPIRATION:86400000}
